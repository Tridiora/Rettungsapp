<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f0f7fa"/><rect width="1280" height="12" fill="#087f8c"/><text x="45" y="65" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#17364b"><tspan x="45" dy="0">Bronchien &amp; Lungenbläschen</tspan></text><text x="45" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#087f8c"><tspan x="45" dy="0">EIGENES LERNSCHEMA · STRUKTUR 1 / 2</tspan></text><g transform="translate(20 130)"><path d="M225 75 H270 V200 L350 260 L330 285 L248 225 L165 285 L145 260 L225 200 Z" fill="#67e8f9" fill-opacity="1" stroke="#075c70" stroke-width="4"/><path d="M175 310 C125 285 110 355 150 375 C115 415 170 455 200 425 C235 470 280 455 285 425 C345 450 380 395 340 365 C380 310 315 280 290 320 C260 270 205 275 175 310 Z" fill="#fda4af" fill-opacity="0.22" stroke="#97aebc" stroke-width="1"/><circle cx="245" cy="155" r="14" fill="#075c70"/><text x="245" y="160" text-anchor="middle" font-size="15" fill="white">1</text></g><rect x="550" y="150" width="680" height="490" rx="24" fill="white"/><text x="580" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#17364b"><tspan x="580" dy="0">Bronchus</tspan></text><text x="580" y="250" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#087f8c"><tspan x="580" dy="0">Bronchus</tspan></text><text x="580" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#17364b"><tspan x="580" dy="0">In der Lunge verzweigen sich die Luftwege wie</tspan><tspan x="580" dy="29.4">die Äste eines Baumes. Sie verteilen die</tspan><tspan x="580" dy="29.4">eingeatmete Luft immer weiter in der Lunge.</tspan><tspan x="580" dy="29.4">Einen solchen Luftweg nennt man Bronchus.</tspan></text><text x="45" y="690" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#526b78"><tspan x="45" dy="0">Vereinfachte Darstellung · nicht maßstabsgetreu</tspan></text><rect x="550" y="655" width="340" height="6" fill="#087f8c"/></svg>