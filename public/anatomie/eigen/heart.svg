<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f0f7fa"/><rect width="1280" height="12" fill="#087f8c"/><text x="45" y="65" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#17364b"><tspan x="45" dy="0">Herz</tspan></text><text x="45" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#087f8c"><tspan x="45" dy="0">EIGENES LERNSCHEMA · STRUKTUR 1 / 4</tspan></text><g transform="translate(20 130)"><path d="M230 140 C175 110 110 140 115 205 Q130 245 230 240 Z" fill="#60a5fa" fill-opacity="1" stroke="#075c70" stroke-width="4"/><path d="M115 255 Q110 350 245 410 L230 255 Z" fill="#38bdf8" fill-opacity="0.22" stroke="#97aebc" stroke-width="1"/><path d="M255 140 C310 105 375 135 375 210 Q350 245 255 240 Z" fill="#fda4af" fill-opacity="0.22" stroke="#97aebc" stroke-width="1"/><path d="M255 255 L255 410 Q385 360 375 255 Z" fill="#fb7185" fill-opacity="0.22" stroke="#97aebc" stroke-width="1"/><circle cx="180" cy="190" r="14" fill="#075c70"/><text x="180" y="195" text-anchor="middle" font-size="15" fill="white">1</text></g><rect x="550" y="150" width="680" height="490" rx="24" fill="white"/><text x="580" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#17364b"><tspan x="580" dy="0">Rechter Vorhof</tspan></text><text x="580" y="250" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#087f8c"><tspan x="580" dy="0">Atrium dextrum</tspan></text><text x="580" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#17364b"><tspan x="580" dy="0">Das Herz ist eine Pumpe mit vier Räumen. In</tspan><tspan x="580" dy="29.4">diesem Raum kommt Blut aus dem Körper zurück. Es</tspan><tspan x="580" dy="29.4">hat dort Sauerstoff abgegeben und fließt als</tspan><tspan x="580" dy="29.4">Nächstes in die rechte Herzkammer.</tspan></text><text x="45" y="690" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#526b78"><tspan x="45" dy="0">Vereinfachte Darstellung · nicht maßstabsgetreu</tspan></text><rect x="550" y="655" width="170" height="6" fill="#087f8c"/></svg>