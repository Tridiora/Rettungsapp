<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f0f7fa"/><rect width="1280" height="12" fill="#087f8c"/><text x="45" y="65" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#17364b"><tspan x="45" dy="0">Lunge &amp; Brustkorb</tspan></text><text x="45" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#087f8c"><tspan x="45" dy="0">EIGENES LERNSCHEMA · STRUKTUR 1 / 4</tspan></text><g transform="translate(20 130)"><path d="M235 75 H265 V210 L310 245 L295 265 L250 230 L205 265 L190 245 L235 210 Z" fill="#67e8f9" fill-opacity="1" stroke="#075c70" stroke-width="4"/><path d="M210 165 Q160 125 105 245 Q75 315 95 390 Q145 415 215 375 Z" fill="#7dd3fc" fill-opacity="0.22" stroke="#97aebc" stroke-width="1"/><path d="M290 165 Q340 125 395 245 Q425 315 405 390 Q360 412 290 375 L310 285 L290 245 Z" fill="#a5b4fc" fill-opacity="0.22" stroke="#97aebc" stroke-width="1"/><path d="M90 450 Q250 350 410 450 L405 470 Q250 390 95 470 Z" fill="#5eead4" fill-opacity="0.22" stroke="#97aebc" stroke-width="1"/><circle cx="250" cy="130" r="14" fill="#075c70"/><text x="250" y="135" text-anchor="middle" font-size="15" fill="white">1</text></g><rect x="550" y="150" width="680" height="490" rx="24" fill="white"/><text x="580" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#17364b"><tspan x="580" dy="0">Luftröhre</tspan></text><text x="580" y="250" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#087f8c"><tspan x="580" dy="0">Trachea</tspan></text><text x="580" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#17364b"><tspan x="580" dy="0">Die Luftröhre ist der gemeinsame Luftweg zur</tspan><tspan x="580" dy="29.4">Lunge. Sie teilt sich in zwei große Äste: einer</tspan><tspan x="580" dy="29.4">führt in die rechte, der andere in die linke</tspan><tspan x="580" dy="29.4">Lungenhälfte.</tspan></text><text x="45" y="690" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#526b78"><tspan x="45" dy="0">Vereinfachte Darstellung · nicht maßstabsgetreu</tspan></text><rect x="550" y="655" width="170" height="6" fill="#087f8c"/></svg>