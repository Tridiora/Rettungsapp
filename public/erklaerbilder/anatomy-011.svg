<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 482" role="img" aria-labelledby="title desc"><title id="title">Welche Gefäße ermöglichen vor allem den Stoffaustausch mit Gewebe?</title><desc id="desc">Kapillaren. Kapillaren. Arterien führen vom Herzen weg, Venen zum Herzen zurück. Stoffaustausch findet vor allem in der Mikrozirkulation statt.</desc><rect width="1000" height="482" rx="24" fill="#f1f7fa"/><rect width="1000" height="12" fill="#087f8c"/><text x="40" y="49" fill="#087f8c" font-family="Arial,sans-serif" font-size="15"><tspan x="40" dy="0">VERSTEHEN · EINORDNEN · ABGRENZEN</tspan></text><text x="40" y="88" fill="#17364b" font-family="Arial,sans-serif" font-size="22"><tspan x="40" dy="0">Welche Gefäße ermöglichen vor allem den Stoffaustausch mit Gewebe?</tspan></text><path d="M500 114v28" stroke="#087f8c" stroke-width="3"/><path d="M494 133l6 9 6-9" fill="none" stroke="#087f8c" stroke-width="3"/><rect x="30" y="149" width="940" height="65" rx="15" fill="#d9f3e9"/><text x="50" y="181" fill="#155540" font-family="Arial,sans-serif" font-size="22"><tspan x="50" dy="0">✓ Kapillaren</tspan></text><text x="40" y="243" fill="#17364b" font-family="Arial,sans-serif" font-size="17"><tspan x="40" dy="0">Arterien führen vom Herzen weg, Venen zum Herzen zurück. Stoffaustausch findet vor</tspan><tspan x="40" dy="23.799999999999997">allem in der Mikrozirkulation statt.</tspan></text><path d="M500 314v18H260v18 M500 332h240v18" fill="none" stroke="#9baebb" stroke-width="2"/><rect x="30" y="351" width="460" height="93" rx="13" fill="#fff1ef"/><text x="50" y="376" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="50" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="50" y="407" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="50" dy="0">Aorta allein</tspan></text><rect x="510" y="351" width="460" height="93" rx="13" fill="#fff1ef"/><text x="530" y="376" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="530" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="530" y="407" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="530" dy="0">Hohlvenen allein</tspan></text><text x="40" y="467" font-family="Arial,sans-serif" font-size="11" fill="#526b78">Eigenes didaktisches Schema · fachliche Quelle bei der Lernfrage · keine Einsatzanweisung</text></svg>