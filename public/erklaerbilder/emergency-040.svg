<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" role="img" aria-labelledby="title desc"><title id="title">Was sagt die GCS aus?</title><desc id="desc">Standardisierte Beschreibung von Augen-, Sprach- und Motorikreaktion. Standardisierte Beschreibung von Augen-, Sprach- und Motorikreaktion. Neurologische Veränderungen sind zeitkritisch, wenn sie plötzlich auftreten. Blutzucker, Atmung und Kreislauf gehören zur Differenzialbeurteilung.</desc><rect width="1000" height="534" rx="24" fill="#f1f7fa"/><rect width="1000" height="12" fill="#087f8c"/><text x="40" y="49" fill="#087f8c" font-family="Arial,sans-serif" font-size="15"><tspan x="40" dy="0">VERSTEHEN · EINORDNEN · ABGRENZEN</tspan></text><text x="40" y="88" fill="#17364b" font-family="Arial,sans-serif" font-size="22"><tspan x="40" dy="0">Was sagt die GCS aus?</tspan></text><path d="M500 114v28" stroke="#087f8c" stroke-width="3"/><path d="M494 133l6 9 6-9" fill="none" stroke="#087f8c" stroke-width="3"/><rect x="30" y="149" width="940" height="94" rx="15" fill="#d9f3e9"/><text x="50" y="181" fill="#155540" font-family="Arial,sans-serif" font-size="22"><tspan x="50" dy="0">✓ Standardisierte Beschreibung von Augen-, Sprach- und</tspan><tspan x="50" dy="30.799999999999997">Motorikreaktion</tspan></text><text x="40" y="272" fill="#17364b" font-family="Arial,sans-serif" font-size="17"><tspan x="40" dy="0">Neurologische Veränderungen sind zeitkritisch, wenn sie plötzlich auftreten.</tspan><tspan x="40" dy="23.799999999999997">Blutzucker, Atmung und Kreislauf gehören zur Differenzialbeurteilung.</tspan></text><path d="M500 343v18H260v18 M500 361h240v18" fill="none" stroke="#9baebb" stroke-width="2"/><rect x="30" y="380" width="460" height="116" rx="13" fill="#fff1ef"/><text x="50" y="405" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="50" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="50" y="436" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="50" dy="0">Sichere Ursache der</tspan><tspan x="50" dy="22.4">Bewusstseinsstörung</tspan></text><rect x="510" y="380" width="460" height="116" rx="13" fill="#fff1ef"/><text x="530" y="405" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="530" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="530" y="436" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="530" dy="0">Ausschließlich Sauerstoffsättigung</tspan></text><text x="40" y="519" font-family="Arial,sans-serif" font-size="11" fill="#526b78">Eigenes didaktisches Schema · fachliche Quelle bei der Lernfrage · keine Einsatzanweisung</text></svg>