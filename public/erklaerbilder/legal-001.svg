<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 557" role="img" aria-labelledby="title desc"><title id="title">Was ist grundsätzlich vor einer medizinischen Maßnahme erforderlich?</title><desc id="desc">Einwilligung nach erforderlicher Aufklärung. Einwilligung nach erforderlicher Aufklärung. Medizinische Maßnahmen benötigen grundsätzlich eine wirksame Einwilligung. Für unaufschiebbare Maßnahmen bei fehlender rechtzeitiger Einholbarkeit gelten besondere Voraussetzungen.</desc><rect width="1000" height="557" rx="24" fill="#f1f7fa"/><rect width="1000" height="12" fill="#087f8c"/><text x="40" y="49" fill="#087f8c" font-family="Arial,sans-serif" font-size="15"><tspan x="40" dy="0">VERSTEHEN · EINORDNEN · ABGRENZEN</tspan></text><text x="40" y="88" fill="#17364b" font-family="Arial,sans-serif" font-size="22"><tspan x="40" dy="0">Was ist grundsätzlich vor einer medizinischen Maßnahme</tspan><tspan x="40" dy="30.799999999999997">erforderlich?</tspan></text><path d="M500 143v28" stroke="#087f8c" stroke-width="3"/><path d="M494 162l6 9 6-9" fill="none" stroke="#087f8c" stroke-width="3"/><rect x="30" y="178" width="940" height="65" rx="15" fill="#d9f3e9"/><text x="50" y="210" fill="#155540" font-family="Arial,sans-serif" font-size="22"><tspan x="50" dy="0">✓ Einwilligung nach erforderlicher Aufklärung</tspan></text><text x="40" y="272" fill="#17364b" font-family="Arial,sans-serif" font-size="17"><tspan x="40" dy="0">Medizinische Maßnahmen benötigen grundsätzlich eine wirksame Einwilligung. Für</tspan><tspan x="40" dy="23.799999999999997">unaufschiebbare Maßnahmen bei fehlender rechtzeitiger Einholbarkeit gelten besondere</tspan><tspan x="40" dy="23.799999999999997">Voraussetzungen.</tspan></text><path d="M500 366v18H260v18 M500 384h240v18" fill="none" stroke="#9baebb" stroke-width="2"/><rect x="30" y="403" width="460" height="116" rx="13" fill="#fff1ef"/><text x="50" y="428" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="50" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="50" y="459" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="50" dy="0">Nur Zustimmung der Nachbarn</tspan></text><rect x="510" y="403" width="460" height="116" rx="13" fill="#fff1ef"/><text x="530" y="428" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="530" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="530" y="459" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="530" dy="0">Nur Ausfüllen eines Formulars ohne</tspan><tspan x="530" dy="22.4">Gespräch</tspan></text><text x="40" y="542" font-family="Arial,sans-serif" font-size="11" fill="#526b78">Eigenes didaktisches Schema · fachliche Quelle bei der Lernfrage · keine Einsatzanweisung</text></svg>