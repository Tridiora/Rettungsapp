<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" role="img" aria-labelledby="title desc"><title id="title">Was bedeutet Einwilligungsfähigkeit?</title><desc id="desc">Fähigkeit, Bedeutung und Folgen der konkreten Entscheidung zu verstehen und abzuwägen. Fähigkeit, Bedeutung und Folgen der konkreten Entscheidung zu verstehen und abzuwägen. Medizinische Maßnahmen benötigen grundsätzlich eine wirksame Einwilligung. Für unaufschiebbare Maßnahmen bei fehlender rechtzeitiger Einholbarkeit gelten besondere Voraussetzungen.</desc><rect width="1000" height="534" rx="24" fill="#f1f7fa"/><rect width="1000" height="12" fill="#087f8c"/><text x="40" y="49" fill="#087f8c" font-family="Arial,sans-serif" font-size="15"><tspan x="40" dy="0">VERSTEHEN · EINORDNEN · ABGRENZEN</tspan></text><text x="40" y="88" fill="#17364b" font-family="Arial,sans-serif" font-size="22"><tspan x="40" dy="0">Was bedeutet Einwilligungsfähigkeit?</tspan></text><path d="M500 114v28" stroke="#087f8c" stroke-width="3"/><path d="M494 133l6 9 6-9" fill="none" stroke="#087f8c" stroke-width="3"/><rect x="30" y="149" width="940" height="94" rx="15" fill="#d9f3e9"/><text x="50" y="181" fill="#155540" font-family="Arial,sans-serif" font-size="22"><tspan x="50" dy="0">✓ Fähigkeit, Bedeutung und Folgen der konkreten Entscheidung zu</tspan><tspan x="50" dy="30.799999999999997">verstehen und abzuwägen</tspan></text><text x="40" y="272" fill="#17364b" font-family="Arial,sans-serif" font-size="17"><tspan x="40" dy="0">Medizinische Maßnahmen benötigen grundsätzlich eine wirksame Einwilligung. Für</tspan><tspan x="40" dy="23.799999999999997">unaufschiebbare Maßnahmen bei fehlender rechtzeitiger Einholbarkeit gelten besondere</tspan><tspan x="40" dy="23.799999999999997">Voraussetzungen.</tspan></text><path d="M500 366v18H260v18 M500 384h240v18" fill="none" stroke="#9baebb" stroke-width="2"/><rect x="30" y="403" width="460" height="93" rx="13" fill="#fff1ef"/><text x="50" y="428" fill="#9b4339" font-family="Aria