<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 511" role="img" aria-labelledby="title desc"><title id="title">Wer ist bei fehlender eigener Einwilligungsfähigkeit grundsätzlich einzubeziehen?</title><desc id="desc">Berechtigte Vertretung unter Beachtung der Situation. Berechtigte Vertretung unter Beachtung der Situation. Entscheidungen bei Minderjährigen benötigen eine situationsbezogene Beurteilung. Reife, Maßnahme, Sorgeberechtigung und Dringlichkeit spielen eine Rolle.</desc><rect width="1000" height="511" rx="24" fill="#f1f7fa"/><rect width="1000" height="12" fill="#087f8c"/><text x="40" y="49" fill="#087f8c" font-family="Arial,sans-serif" font-size="15"><tspan x="40" dy="0">VERSTEHEN · EINORDNEN · ABGRENZEN</tspan></text><text x="40" y="88" fill="#17364b" font-family="Arial,sans-serif" font-size="22"><tspan x="40" dy="0">Wer ist bei fehlender eigener Einwilligungsfähigkeit grundsätzlich</tspan><tspan x="40" dy="30.799999999999997">einzubeziehen?</tspan></text><path d="M500 143v28" stroke="#087f8c" stroke-width="3"/><path d="M494 162l6 9 6-9" fill="none" stroke="#087f8c" stroke-width="3"/><rect x="30" y="178" width="940" height="65" rx="15" fill="#d9f3e9"/><text x="50" y="210" fill="#155540" font-family="Arial,sans-serif" font-size="22"><tspan x="50" dy="0">✓ Berechtigte Vertretung unter Beachtung der Situation</tspan></text><text x="40" y="272" fill="#17364b" font-family="Arial,sans-serif" font-size="17"><tspan x="40" dy="0">Entscheidungen bei Minderjährigen benötigen eine situationsbezogene Beurteilung.</tspan><tspan x="40" dy="23.799999999999997">Reife, Maßnahme, Sorgeberechtigung und Dringlichkeit spielen eine Rolle.</tspan></text><path d="M500 343v18H260v18 M500 361h240v18" fill="none" stroke="#9baebb" stroke-width="2"/><rect x="30" y="380" width="460" height="93" rx="13" fill="#fff1ef"/><text x="50" y="405" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="50" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="50" y="436" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="50" dy="0">Immer nur die Polizei</tspan></text><rect x="510" y="380" width="460" height="93" rx="13" fill="#fff1ef"/><text x="530" y="405" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="530" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="530" y="436" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="530" dy="0">Beliebige erwachsene Begleitperson</tspan></text><text x="40" y="496" font-family="Arial,sans-serif" font-size="11" fill="#526b78">Eigenes didaktisches Schema · fachliche Quelle bei der Lernfrage · keine Einsatzanweisung</text></svg>