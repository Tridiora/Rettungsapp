<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc"><title id="title">Was ist bei unbekannter Atmosphäre in einem engen Raum wichtig?</title><desc id="desc">Nicht ungesichert betreten und geeignete Kräfte anfordern. Nicht ungesichert betreten und geeignete Kräfte anfordern. Eigenschutz ist Voraussetzung für wirksame Hilfe. Gefahren werden vor dem Betreten und während des Einsatzes wiederholt beurteilt.</desc><rect width="1000" height="505" rx="24" fill="#f1f7fa"/><rect width="1000" height="12" fill="#087f8c"/><text x="40" y="49" fill="#087f8c" font-family="Arial,sans-serif" font-size="15"><tspan x="40" dy="0">VERSTEHEN · EINORDNEN · ABGRENZEN</tspan></text><text x="40" y="88" fill="#17364b" font-family="Arial,sans-serif" font-size="22"><tspan x="40" dy="0">Was ist bei unbekannter Atmosphäre in einem engen Raum wichtig?</tspan></text><path d="M500 114v28" stroke="#087f8c" stroke-width="3"/><path d="M494 133l6 9 6-9" fill="none" stroke="#087f8c" stroke-width="3"/><rect x="30" y="149" width="940" height="65" rx="15" fill="#d9f3e9"/><text x="50" y="181" fill="#155540" font-family="Arial,sans-serif" font-size="22"><tspan x="50" dy="0">✓ Nicht ungesichert betreten und geeignete Kräfte anfordern</tspan></text><text x="40" y="243" fill="#17364b" font-family="Arial,sans-serif" font-size="17"><tspan x="40" dy="0">Eigenschutz ist Voraussetzung für wirksame Hilfe. Gefahren werden vor dem Betreten</tspan><tspan x="40" dy="23.799999999999997">und während des Einsatzes wiederholt beurteilt.</tspan></text><path d="M500 314v18H260v18 M500 332h240v18" fill="none" stroke="#9baebb" stroke-width="2"/><rect x="30" y="351" width="460" height="116" rx="13" fill="#fff1ef"/><text x="50" y="376" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="50" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="50" y="407" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="50" dy="0">Mit angehaltenem Atem hineingehen</tspan></text><rect x="510" y="351" width="460" height="116" rx="13" fill="#fff1ef"/><text x="530" y="376" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="530" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="530" y="407" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="530" dy="0">Geruch als alleinige Freigabe</tspan><tspan x="530" dy="22.4">nutzen</tspan></text><text x="40" y="490" font-family="Arial,sans-serif" font-size="11" fill="#526b78">Eigenes didaktisches Schema · fachliche Quelle bei der Lernfrage · keine Einsatzanweisung</text></svg>