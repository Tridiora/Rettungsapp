<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc"><title id="title">Wie wird ein erkannter Fehler konstruktiv angesprochen?</title><desc id="desc">Konkret, zeitnah und lösungsorientiert. Konkret, zeitnah und lösungsorientiert. Klare Aufgaben, bestätigte Kommunikation und gegenseitige Kontrolle verbessern die Zusammenarbeit. Fachliche Bedenken dürfen unabhängig von Hierarchie angesprochen werden.</desc><rect width="1000" height="505" rx="24" fill="#f1f7fa"/><rect width="1000" height="12" fill="#087f8c"/><text x="40" y="49" fill="#087f8c" font-family="Arial,sans-serif" font-size="15"><tspan x="40" dy="0">VERSTEHEN · EINORDNEN · ABGRENZEN</tspan></text><text x="40" y="88" fill="#17364b" font-family="Arial,sans-serif" font-size="22"><tspan x="40" dy="0">Wie wird ein erkannter Fehler konstruktiv angesprochen?</tspan></text><path d="M500 114v28" stroke="#087f8c" stroke-width="3"/><path d="M494 133l6 9 6-9" fill="none" stroke="#087f8c" stroke-width="3"/><rect x="30" y="149" width="940" height="65" rx="15" fill="#d9f3e9"/><text x="50" y="181" fill="#155540" font-family="Arial,sans-serif" font-size="22"><tspan x="50" dy="0">✓ Konkret, zeitnah und lösungsorientiert</tspan></text><text x="40" y="243" fill="#17364b" font-family="Arial,sans-serif" font-size="17"><tspan x="40" dy="0">Klare Aufgaben, bestätigte Kommunikation und gegenseitige Kontrolle verbessern die</tspan><tspan x="40" dy="23.799999999999997">Zusammenarbeit. Fachliche Bedenken dürfen unabhängig von Hierarchie angesprochen</tspan><tspan x="40" dy="23.799999999999997">werden.</tspan></text><path d="M500 337v18H260v18 M500 355h240v18" fill="none" stroke="#9baebb" stroke-width="2"/><rect x="30" y="374" width="460" height="93" rx="13" fill="#fff1ef"/><text x="50" y="399" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="50" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="50" y="430" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="50" dy="0">Persönlich abwertend</tspan></text><rect x="510" y="374" width="460" height="93" rx="13" fill="#fff1ef"/><text x="530" y="399" fill="#9b4339" font-family="Arial,sans-serif" font-size="12"><tspan x="530" dy="0">NICHT DIE RICHTIGE ANTWORT</tspan></text><text x="530" y="430" fill="#743c36" font-family="Arial,sans-serif" font-size="16"><tspan x="530" dy="0">Gar nicht</tspan></text><text x="40" y="490" font-family="Arial,sans-serif" font-size="11" fill="#526b78">Eigenes didaktisches Schema · fachliche Quelle bei der Lernfrage · keine Einsatzanweisung</text></svg>